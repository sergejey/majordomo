<style>
body, html { 
    width: 100%;
    height: 100%;
}

.full-size {
    min-width: 100%;
    min-height: 100%;
    position: relative;
	background-image: url(https://ru.majordomohome.com/wp-content/uploads/2018/04/logo-md.png), linear-gradient(to top left, powderblue, pink);
    background-repeat: no-repeat;
    background-position: right center;
}

.full-size.theme-dark {
    color-scheme: dark;
    background-image: url(https://ru.majordomohome.com/wp-content/uploads/2018/04/logo-md.png), linear-gradient(to top left, #163a40, #3d1f2c);
}

.full-size.theme-dark .form-control {
    color: #e0e0e0;
    background-color: #464545;
    border-color: #555;
}

.full-size.theme-dark .form-control:focus {
    border-color: #4792d1;
    box-shadow: none;
}

/* same metrics in light and dark themes */
.full-size {
    font-size: 14px;
    line-height: 20px;
}

.full-size h1 {
    margin: 20px 0 10px;
    font-size: 36px;
    font-weight: 500;
    line-height: 1.1;
}

.full-size .form-control {
    height: 34px;
    padding: 6px 12px;
    font-size: 14px;
}

.full-size .btn {
    padding: 6px 12px;
    font-size: 14px;
    line-height: 20px;
}
</style>

<div class="full-size[#if "<#SETTINGS_THEME#>"=="dark"#] theme-dark[#endif#]">
	<div class="col-md-6 col-md-offset-3" style="padding-left: 30px;">
		<div align="left" style="max-width:500px;padding-top:150px">
			<h1>Hello, world! :)</h1>
			<p style="margin-bottom: 30px;">echo 'system has been started!';</p>
			<form action="?" method="get">
				<#LANG_TIME_ZONE#>:<br>
				<div class="form-group">
					<select name='timezone' id='timezone' style='max-width:350px' class="form-control">
					[#begin ZONELIST#]
						<option value="[#OFFSET#]"[#if TITLE="<#SETTINGS_SITE_TIMEZONE#>"#] selected[#endif#]>[#TITLE#] (GMT [#OFFSET_TEXT#])
					[#end ZONELIST#]
					</select>
				</div>
				
				<div class="row" style="margin-right: 0px;margin-left: 0px;">
				<#LANG_LANGUAGE#>:<Br>
					[#begin LANGUAGES#]
					<div class="col-md-4">
						<label for="lang_[#TITLE#]">
						<input style="vertical-align: sub;" type="radio" name="language" id="lang_[#TITLE#]" value="[#TITLE#]"[#if TITLE="<#SETTINGS_SITE_LANGUAGE#>"#] checked[#endif#]>
						<img style="margin-left: 10px;" src="<#ROOTHTML#>img/flags/[#TITLE#].png" alt="[#TITLE#]" border="0" height="30" align="absmiddle"> [#CAPTION#]
						</label>
					</div>
				[#end LANGUAGES#]
				</div>
					
				<div>
				<#LANG_COLOR_THEME#>:
				<input type="radio" name="theme" value="dark"[#if "<#SETTINGS_THEME#>"!="light"#] checked[#endif#]> <#LANG_THEME_DARK#>
				<input type="radio" name="theme" value="light"[#if "<#SETTINGS_THEME#>"=="light"#] checked[#endif#]> <#LANG_THEME_LIGHT#>

					</div>
				<br>
				<input type="submit" name="submit" value="<#LANG_CONTINUE#> &gt;&gt;&gt;"  class="btn btn-default">
				<input type="hidden" name="timezone_title" id="timezone_title" value="">
				<input type="hidden" name="mode" value="update">
				<input type="hidden" name="action" value="<#ACTION#>">

			</form>

			<script language="javascript">
			[#if "<#SETTINGS_SITE_TIMEZONE#>"==""#]
			$(document).ready(function(){   
				var d = new Date()
				var offset= -d.getTimezoneOffset()/60;
				$('#timezone').val(offset);
				$('#timezone_title').val($('#timezone :selected').html());
			});     
			[#endif#]

			$('#timezone').change(function() {
			   $('#timezone_title').val($('#timezone :selected').html());
			});

			// preview the colour theme without saving
			$('input[name="theme"]').change(function() {
				var dark = this.value == 'dark';
				$('link[rel="stylesheet"]').each(function() {
					if (this.id == 'theme') return;
					var href = $(this).attr('href');
					if (dark) {
						href = href.replace('bootstrap.min.css', 'bootstrap_dark.min.css').replace('bootstrap.min.css', 'bootstrap_dark.min.css').replace('ui-lightness', 'ui-darkness').replace('stl_light.css', 'stl_dark.css');
					} else {
						href = href.replace('bootstrap_dark.min.css', 'bootstrap.min.css').replace('ui-darkness', 'ui-lightness').replace('stl_dark.css', 'stl_light.css');
					}
					$(this).attr('href', href);
				});
				$('.full-size').toggleClass('theme-dark', dark);
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				$('body').css('background-color', dark ? '#222222' : 'white');
			});
			</script>
		</div>
	</div>
</div>
