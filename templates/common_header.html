<script type="text/javascript">
	// Set the theme before stylesheets load to avoid a flash of the wrong palette.
	(function () {
		// 07:00-19:00 is light, the rest of the day is dark.
		function resolve(choice) {
			// auto уже разрешён на сервере (MJ_THEME), чтобы не расходиться с CSS-ссылками
			if (choice === 'auto') return '<#MJ_THEME#>';
			return choice === 'dark' ? 'dark' : 'light';
		}

		var match = document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);
		var choice = match ? match[1] : '<#MJ_THEME#>';
		try { choice = decodeURIComponent(choice); } catch (e) { /* keep raw value */ }
		if (choice !== 'auto' && choice !== 'dark' && choice !== 'light') {
			choice = '<#MJ_THEME#>';
		}
		if (choice !== 'auto' && choice !== 'dark' && choice !== 'light') choice = 'light';
		document.documentElement.setAttribute('data-theme', resolve(choice));

		window.MJDTheme = {
			set: function (value) {
				choice = value === 'auto' ? 'auto' : (value === 'dark' ? 'dark' : 'light');
				var theme = resolve(choice);
				document.documentElement.setAttribute('data-theme', theme);
				document.cookie = 'theme=' + choice + '; path=/; max-age=' + (180 * 24 * 60 * 60);
				var link = document.getElementById('theme');
				if (link) {
					link.href = '<#ROOTHTML#>3rdparty/bootstrap/css/' +
						(theme === 'dark' ? 'bootstrap_dark_admin.css' : 'bootstrap.min.css');
				}
			}
		};
	})();
</script>
